name: ReportaPA tests
on:
  workflow_dispatch:
  push:
    branches: [fix/reportapa-capacity-20261011, feat/reportapa-statistics-20261012, feat/entregas-real-20261013]
  pull_request:
    branches: [main]
concurrency:
  group: reportapa-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reportapa
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: reportapa_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U reportapa -d reportapa_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPORTAPA_RECOVERY_TEST: disposable-ci
      PUBLIC_REPORTS_ENABLED: "false"
      DATABASE_URL: postgresql://reportapa:test-only@localhost:5432/reportapa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx psutil pypdf==5.9.0
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pytest -q
      - run: node --check app/static/citizen.js && node --check app/static/admin.js && node --check app/static/aid.js
      - run: node --test tests/test_*.js
      - run: docker build --tag reportapa-ci .
      - run: python scripts/load_capacity.py
      - uses: actions/upload-artifact@v4
        with:
          name: reportapa-capacity-results
          path: docs/capacity-results.json

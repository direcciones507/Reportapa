name: ReportaPA tests
on:
  push:
    branches: [feat/reportapa-mvp-20261010]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reportapa
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: reportapa_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reportapa:test-only@localhost:5432/reportapa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: node --check app/static/citizen.js && node --check app/static/admin.js

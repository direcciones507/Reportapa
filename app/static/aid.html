<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ReportaPA · Entrega de ayuda</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/aid.js"></script></head><body><header><div><h1>ReportaPA 🇵🇦</h1><p>Registro privado de entrega de ayuda</p></div></header><main><a href="/">Volver al inicio</a><form id="aid-login"><h2>Personal autorizado</h2><label>Nombre completo<input name="full_name" maxlength="180" autocomplete="name" required></label><label>Código personal<input name="code" type="password" maxlength="128" autocomplete="off" required></label><button>Ingresar</button></form><section id="aid-panel" hidden><p id="worker"></p><button id="aid-logout" type="button">Cerrar sesión</button><form id="aid-form"><h2>Registrar entrega</h2><label>Nombre completo del beneficiario<input name="beneficiary_name" maxlength="180" required></label><label>Cédula del beneficiario<input name="beneficiary_id" maxlength="50" required></label><label>Lugar o comunidad<input name="place" maxlength="300" required></label><label>Tipo de ayuda entregada<textarea name="aid_type" maxlength="500" required></textarea></label><button id="aid-save">Guardar entrega</button></form></section><p id="aid-message" role="status" aria-live="polite"></p></main></body></html>
